name: Derle ve yayımla

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıklar
        run: npm install

      - name: Testler
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Derle ve paketle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "UDF Resimcisi ${{ github.ref_name }}"
          releaseBody: |
            Resmi ideal çözünürlükte, kalitesini koruyarak UDF'ye koyar; açılan belgeden kopyalayıp dilekçenize yapıştırın.

            Kod imzalama sertifikası yok: Windows SmartScreen uyarı gösterirse
            **Daha fazla bilgi → Yine de çalıştır** deyin.
          releaseDraft: true
          prerelease: false

      - name: Taşınabilir exe'yi de yükle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/udf-resimcisi.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
